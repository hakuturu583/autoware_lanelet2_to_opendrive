# @package _global_
# Odaiba map configuration.
#
# No `xodr_path` is set here: at run time the OpenDRIVE is sourced from the live
# CARLA 'Odaiba' map (its geoReference gives the projection origin), so ordinary
# scenarios need no bundled .xodr.  The `ego.entity=autoware_ego` closed-loop
# build is the exception -- it derives the initial/goal pose *before* CARLA is up
# and therefore needs OpenDRIVE from a file: set `map.xodr_path` to a bundled
# .xodr when running autoware_ego.
#
# `lanelet2_path` defaults to the map bundled inside this package -- register()
# sets ODAIBA_LANELET2_PATH to that bundled file if it is not already set, so
# `scenario=odaiba_outbound/default` works out of the box.  Override with:
#   uv run scenario map=odaiba map.lanelet2_path=/other/path.osm
map:
  # Must match the CARLA server's map asset name (short name or full asset path);
  # the runner loads this world via load_map_by_name. On CARLA 0.10.0 the Odaiba
  # map is exposed as 'Odaiba'.
  name: Odaiba
  lanelet2_path: ${oc.env:ODAIBA_LANELET2_PATH}
