repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # The vendored alpasim protos are copied verbatim from upstream (see
      # autoware_carla_scenario/proto/README.md) and the modules under _proto/ are
      # protoc output checked byte-for-byte by test_proto_generated.py. Reformatting
      # either would break that guarantee.
      - id: trailing-whitespace
        exclude: '^autoware_carla_scenario/(proto/|src/autoware_carla_scenario/driver/_proto/)'
      - id: end-of-file-fixer
        exclude: '^autoware_carla_scenario/(proto/|src/autoware_carla_scenario/driver/_proto/)'
      - id: check-yaml
        exclude: 'mkdocs\.yml$'
      - id: check-added-large-files
        exclude: '\.(osm|xodr|png|whl)$'
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: mixed-line-ending

  # - repo: https://github.com/psf/black
  #   rev: 24.10.0
  #   hooks:
  #     - id: black
  #       language_version: python3.10

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        args:
          - --ignore-missing-imports
          - autoware_lanelet2_to_opendrive/src
          - autoware_lanelet2_to_opendrive/test
          - autoware_carla_scenario/src
          - autoware_carla_scenario/test
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      # Each package's tests run in their own process. This originally worked
      # around a crash in the lanelet2 C++ bindings at interpreter shutdown;
      # simple-lanelet2 no longer has that failure mode, but keeping the two
      # suites separate still gives a clearer signal about which one broke.
      #
      # Neither hook uses `always_run`: running both suites on every commit
      # meant a one-line docs fix paid for minutes of end-to-end conversion and
      # wheelhouse builds. `files` scopes each suite to the changes that can
      # actually break it. Note the direction -- `autoware_carla_scenario`
      # imports `autoware_lanelet2_to_opendrive`, so a change to the converter
      # runs *both* suites, while a change to the framework runs only its own.
      # The workspace's `pyproject.toml` and `uv.lock` move every dependency
      # under both, so they run both too, and `carla_wheels/` runs the
      # framework's: `carla_wheels()` reads that directory, and a test asserts
      # its interpreter tags cover the declared `requires-python`.
      #
      # `pass_filenames: false` because pytest is given the test directory
      # rather than the changed files: a change anywhere in a package can break
      # any of its tests, not just a test file that happens to have been edited.
      - id: pytest-lanelet2
        name: pytest (autoware_lanelet2_to_opendrive)
        entry: uv run pytest --no-testmon autoware_lanelet2_to_opendrive/test
        language: system
        pass_filenames: false
        files: '^(autoware_lanelet2_to_opendrive/|pyproject\.toml$|uv\.lock$)'
      - id: pytest-carla
        name: pytest (autoware_carla_scenario)
        entry: uv run pytest --no-testmon -m "not integration" autoware_carla_scenario/test
        language: system
        pass_filenames: false
        files: '^(autoware_carla_scenario/|autoware_lanelet2_to_opendrive/|carla_wheels/|pyproject\.toml$|uv\.lock$)'
